name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * 1" # weekly rebuild: fresh base layers + package updates

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: vdementev/docker-workflows/.github/workflows/build-image.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      image: nginx
      push: ${{ github.event_name != 'pull_request' }}
      tags: |
        type=raw,value=latest
      # Smoke-tests the locally built amd64 image before it can be published:
      # SPA fallback, cache + security headers, br/zstd/gzip, :8080, rootless
      # mode. $IMAGE is set by the reusable workflow.
      test-command: ./tests.sh
      # The apk package is deliberately unpinned, so the version tags are read
      # back out of the image that just passed the tests: 1.30.4 and 1.30.
      version-command: docker run --rm "$IMAGE" nginx -v 2>&1 | sed -n 's|.*nginx/\([0-9][0-9.]*\).*|\1|p'
      labels: |
        org.opencontainers.image.title=nginx
        org.opencontainers.image.description=Reusable nginx base — brotli + zstd + Prometheus stub_status.
        org.opencontainers.image.url=https://hub.docker.com/r/dementev/nginx
        org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.vendor=Lotus Web Agency
        org.opencontainers.image.authors=Vasilii Dementev https://vasiliidementev.com
        org.opencontainers.image.licenses=MIT
    secrets: inherit

  sync-description:
    if: github.event_name != 'pull_request'
    needs: build
    uses: vdementev/docker-workflows/.github/workflows/sync-description.yml@v1
    with:
      image: nginx
      short-description: "Alpine nginx for static/SPA behind a reverse proxy: brotli + zstd + Prometheus stub_status."
    secrets: inherit
