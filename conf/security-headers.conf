# Baseline security headers for every response.
#
# Kept in a snippet because nginx's add_header does not merge across
# levels: a `location` that sets any header of its own drops every
# header inherited from `server`. The cache-control locations below all
# do exactly that, so each of them has to include this file again —
# otherwise /index.html, the one response that actually renders HTML,
# would be served with no security headers at all.
#
# CSP is intentionally absent — it has to be tuned per app.
add_header X-Content-Type-Options    "nosniff"                                      always;
add_header X-Frame-Options           "SAMEORIGIN"                                   always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
